<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aurasense</title>
<meta name="robots" content="noindex">
<meta name="description" content="Aurasense is a living map of how places feel, made from what people sense there. Free to wander, with no account needed.">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:radial-gradient(62% 60% at 50% 40%, #17142e 0%, #0c0a18 55%, #07060e 100%);
    color:#f3eeff;
    font-family:"Helvetica Neue","Segoe UI",system-ui,-apple-system,sans-serif;
    display:flex;align-items:center;justify-content:center;
    min-height:100svh;overflow:hidden;position:relative;
  }
  .stage{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;padding:6vw}
  .glow{
    position:absolute;top:50%;left:50%;
    width:min(80vw,560px);height:min(80vw,560px);
    transform:translate(-50%,-58%);
    border-radius:50%;
    background:
      radial-gradient(closest-side at 45% 43%, rgba(196,181,253,.55), transparent 72%),
      radial-gradient(closest-side at 59% 57%, rgba(255,159,192,.42), transparent 72%),
      radial-gradient(closest-side at 52% 52%, rgba(255,214,166,.30), transparent 64%),
      radial-gradient(closest-side at 50% 46%, rgba(255,255,255,.75), transparent 22%);
    filter:blur(6px);
    animation:breathe 6.5s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes breathe{
    0%,100%{transform:translate(-50%,-58%) scale(1);opacity:.82}
    50%{transform:translate(-50%,-58%) scale(1.06);opacity:1}
  }
  .mark{position:relative;z-index:1}
  .word{
    font-weight:300;
    font-size:clamp(2.1rem,9vw,4.6rem);
    letter-spacing:.34em;
    text-transform:lowercase;
    color:#f5f1ff;
    text-shadow:0 0 36px rgba(196,181,253,.55), 0 0 14px rgba(255,255,255,.22);
    padding-left:.34em;
  }
  .soon{
    margin-top:2.1em;
    font-size:.8rem;
    letter-spacing:.5em;
    text-transform:uppercase;
    color:#9a90c2;
    padding-left:.5em;
  }
  /* 17 Nov 2026 · Build 183 · the front door: one plain sentence, one way in */
  body{overflow:auto;align-items:flex-start}
  .stage{margin:auto;padding-top:max(6vw,28px);padding-bottom:max(6vw,28px)}
  .say{position:relative;z-index:1;margin-top:1.9em;max-width:26em;font-family:Georgia,"Iowan Old Style","Times New Roman",serif;font-size:clamp(1.05rem,4vw,1.22rem);line-height:1.55;color:#e9e2ff}
  .enter{position:relative;z-index:1;margin-top:1.7em;display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 2.1em;border-radius:999px;
    background:linear-gradient(135deg,#c4b5fd,#ffb7cf);color:#1a1230;font-weight:600;font-size:1.05rem;letter-spacing:.04em;text-decoration:none;box-shadow:0 8px 34px rgba(196,181,253,.32)}
  .enter:focus-visible{outline:3px solid #fff;outline-offset:3px}
  .free{position:relative;z-index:1;margin-top:1.1em;font-size:.9rem;line-height:1.5;color:#ebe5ff;max-width:24em;text-shadow:0 0 6px #0c0a18,0 0 14px #0c0a18,0 0 22px #0c0a18}   /* Build 184 · Karl: "Word obscured by light." */
  .glow{opacity:.6;animation:none}
  /* 14 Nov 2026 · Build 171 · what is open now, while the map is made ready */
  .open{position:relative;z-index:1;margin-top:3em;display:flex;flex-direction:column;align-items:center}
  .open p{font-size:.8rem;letter-spacing:.4em;text-transform:uppercase;color:#9a90c2;padding-left:.4em;margin-bottom:.5em}
  .open a{display:inline-flex;align-items:center;min-height:44px;padding:0 .6em;color:#d9cdfc;font-family:Georgia,"Iowan Old Style","Times New Roman",serif;
    font-size:clamp(.98rem,3.6vw,1.08rem);text-decoration:underline;text-decoration-color:rgba(196,181,253,.45);text-underline-offset:.22em}
  .open a:focus-visible{outline:2px solid #c4b5fd;outline-offset:2px;border-radius:6px}
  @media (prefers-reduced-motion:reduce){
    .glow{animation:none;opacity:.95}
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="glow"></div>
    <div class="mark">
      <div class="word">aurasense</div>
    </div>
    <p class="say">A living map of how places feel, made from what people sense there.</p>
    <a class="enter" href="/m">Enter the map</a>
    <p class="free">Free to wander. No account needed. For people 18 and over.</p>
    <nav class="open" aria-label="Also here">
      <p>also here</p>
      <a href="/sense-before-you-sign">A free checklist for choosing a quiet home</a>
      <a href="/pledge">The Mutual Benefit Pledge</a>
      <a href="/ledger">The open ledger</a>
      <a href="/door">The Answering Door</a>
      <a href="/privacy">The privacy promise</a>
    </nav>
  </div>
</body>
</html>
