# Keeps the Aurasense Gate (Supabase) awake.
#
# Supabase pauses a free project when it "does not receive sufficient user database
# activity over the past week" -- "typically a few user requests to the database
# each day" is enough (supabase.com/docs/guides/platform/free-project-pausing).
# This reads a little from the Gate three times a day so it never sleeps.
# Costs nothing, needs no attention.
#
# THREE THINGS LEARNED THE HARD WAY, WRITTEN DOWN SO THEY ARE NOT RELEARNED
#
# 1. THE NEWER PUBLISHABLE KEYS NEED TWO HEADERS WHEN CALLED RAW.
#    supabase-js sends both apikey AND Authorization: Bearer automatically, which
#    is why the live site works. A plain curl sending only apikey gets a 401.
#    Both are sent below.
#
# 2. A PING SHOULD NOT GO RED FOR THE WRONG REASONS.
#    The first version demanded exactly 200 from one named table, so a renamed
#    table, a missing policy or a changed key would all show failure. A red mark
#    that means nothing gets ignored, and that is how a silent failure begins.
#
# 3. KNOCKING ON THE DOOR IS NOT A VISIT. (21 Oct 2026)
#    The second version asked only the REST ROOT. It ran green every day from
#    10 to 21 October, and Supabase still wrote to say the project was idle and
#    would be paused: the root answers without reading the database, so it does
#    not count. Now the job READS the same small public tables the live map reads,
#    a row at a time, three times a day -- real database requests, exactly what
#    any visitor's browser makes. It goes red only when not one read succeeds,
#    because then the Gate is not being kept awake at all (and the live map
#    would be failing in the same way).
#
# NO SECRET TO SET. The project URL and the publishable key are already public in
# gate-config.js on the live site. Hiding them here bought nothing and added a
# step that could be missed.
#
# THIS FILE MUST LIVE AT EXACTLY:  .github/workflows/keep-gate-awake.yml

name: Keep Gate Awake

on:
  schedule:
    - cron: "17 3,11,19 * * *"   # three times a day (03:17, 11:17, 19:17 UTC); off the hour, when GitHub is less busy
  workflow_dispatch: {}          # and by hand, from the Actions tab

permissions:
  contents: read

env:
  GATE: "https://iwuqcmhlbjyjhqexbeyy.supabase.co"
  KEY:  "sb_publishable_trDTjqSBIqdwSyd2EVtJHw_JD2exVmr"

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read a little from the Gate
        run: |
          echo "-- Reading from the Gate, as a visitor's browser would --"
          OK=0; ANSWERED=0
          for T in world_events world_event_counts accord_lights; do
            CODE=$(curl -s -m 25 -o /dev/null -w "%{http_code}" \
              "$GATE/rest/v1/$T?select=*&limit=1" \
              -H "apikey: $KEY" \
              -H "Authorization: Bearer $KEY" \
              -H "Accept: application/json")
            case "$CODE" in
              200) echo "  $T  ->  200  read: the database was visited"; OK=$((OK+1)); ANSWERED=$((ANSWERED+1)) ;;
              000) echo "  $T  ->  no answer at all" ;;
              401) echo "  $T  ->  401  the key was refused"; ANSWERED=$((ANSWERED+1)) ;;
              403) echo "  $T  ->  403  a policy refuses to show it"; ANSWERED=$((ANSWERED+1)) ;;
              404) echo "  $T  ->  404  no such table"; ANSWERED=$((ANSWERED+1)) ;;
              *)   echo "  $T  ->  $CODE"; ANSWERED=$((ANSWERED+1)) ;;
            esac
          done
          echo ""
          if [ "$OK" -gt 0 ]; then
            echo "AWAKE. $OK real read(s) reached the database. Nothing to do."
            exit 0
          fi
          if [ "$ANSWERED" -eq 0 ]; then
            echo "NO ANSWER AT ALL. The project may be paused, or the address is wrong."
            echo "Go to supabase.com/dashboard and check whether aurasense says Paused."
          else
            echo "THE GATE ANSWERED, BUT NOTHING COULD BE READ, so this does not keep it awake."
            echo "If every line says 401, the key has been rotated in Supabase and gate-config.js"
            echo "needs the new one -- and the live site will be failing in the same way."
          fi
          exit 1
