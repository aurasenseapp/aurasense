<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>The Mirror — Aurasense</title>
<!--
  THE LIVING MIRROR · a study, 28 September 2026 · Karl with Claude
  Karl: "I dont like the scrolling aspect of mirror... I thought the presentation would be
  consistent and more dynamic... representing the circular form we have throughout."
  "The whole thing needs to feel organic, etheric and alive!"
  "Mirror not responsive soon enough." (It now speaks its own reflection from the first answer.)

  What it rests on:
  - dark text on a light ground reads better, for younger and older eyes alike (Piepenbrock et al., 2013)
  - one exchange at a time, in one place: nothing to scroll, nothing to go looking for
  - the Mirror asks first, and the person steers (ExploreSelf, CHI 2025)
  - plain words only: every question here can be understood on first reading
  - when someone is confused, it says the same thing more simply instead of carrying on

  Nothing typed here leaves this page. Nothing is stored. No scripts from anywhere else.
-->
<style>
:root{
  --ink:#3b2a3a; --soft:#6f5a6c; --faint:#9a8597;
  --rose:#f3c9c0; --peach:#f8dcc4; --lav:#dcd2f2; --gold:#e9b56a; --sky:#c9dcf4;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{font-family:var(--serif);color:var(--ink);background:#f6e3d6;overflow:hidden;-webkit-font-smoothing:antialiased}

/* the living ground: slow clouds of warm light, never still, never busy */
.ground{position:fixed;inset:-20%;z-index:0;filter:blur(40px);
  background:
    radial-gradient(38% 34% at 22% 28%, var(--rose) 0%, transparent 70%),
    radial-gradient(40% 36% at 78% 30%, var(--lav) 0%, transparent 70%),
    radial-gradient(44% 40% at 30% 78%, var(--peach) 0%, transparent 72%),
    radial-gradient(36% 34% at 76% 76%, var(--sky) 0%, transparent 70%),
    #f6e3d6;
  animation:drift 38s ease-in-out infinite alternate}
@keyframes drift{0%{transform:translate(0,0) rotate(0deg)}50%{transform:translate(-3%,2%) rotate(4deg)}100%{transform:translate(2%,-2%) rotate(-3deg)}}

.stage{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px 16px}

/* THE MIRROR: one circle, breathing at the six-second rhythm */
.mirror{position:relative;width:min(88vw,62vh,540px);aspect-ratio:1;border-radius:50%;
  display:flex;align-items:center;justify-content:center;text-align:center;
  background:radial-gradient(circle at 50% 42%, rgba(255,252,247,.96) 0%, rgba(255,247,240,.9) 52%, rgba(255,240,232,.55) 72%, rgba(255,236,226,0) 100%);
  animation:breathe 6s ease-in-out infinite}
.mirror::before{content:"";position:absolute;inset:-6%;border-radius:50%;z-index:-1;
  background:conic-gradient(from 0deg, rgba(233,181,106,.35), rgba(220,210,242,.45), rgba(243,201,192,.4), rgba(201,220,244,.45), rgba(233,181,106,.35));
  filter:blur(26px);animation:turn 40s linear infinite}
@keyframes breathe{0%,100%{transform:scale(.985)}50%{transform:scale(1.015)}}
@keyframes turn{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.mirror,.mirror::before,.ground{animation:none}}

/* their own words, written around the rim */
.rim{position:absolute;inset:-1%;width:102%;height:102%;pointer-events:none;overflow:visible}
.rim text{font-family:var(--serif);font-style:italic;font-size:3.4px;fill:var(--soft);letter-spacing:.04em;opacity:0;transition:opacity 1.6s ease}
.rim.show text{opacity:.9}

.speak{width:74%;max-height:74%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.7em;
  transition:opacity .9s ease, filter .9s ease}
.speak.fade{opacity:0;filter:blur(6px)}
.as-ws{display:inline}.as-w{display:inline-block}
.as-falling{pointer-events:none}
.as-falling .as-w{animation:asIntoW .95s cubic-bezier(.5,0,.7,.4) both;animation-delay:calc(var(--i,0)*12ms)}
.as-rising .as-w{animation:asOutW 1s cubic-bezier(.2,.7,.25,1) both;animation-delay:calc(.25s + var(--i,0)*14ms)}
/* 4 Oct 2026 · Karl: "falling not down but into, beyond as in behind - from direct view."
   Each word drifts toward the heart of the circle, growing smaller and softer as if moving
   away, while a veil of cloud thickens over it; the next words come forward from behind it. */
@keyframes asIntoW{0%{opacity:1;transform:none;filter:none}100%{opacity:0;transform:translate(var(--tx,0px),var(--ty,0px)) scale(.28);filter:blur(12px)}}
@keyframes asOutW{0%{opacity:0;transform:translate(var(--tx,0px),var(--ty,0px)) scale(.28);filter:blur(12px)}100%{opacity:1;transform:none;filter:none}}
.as-cloudband{position:absolute;left:10%;right:10%;top:16%;bottom:16%;border-radius:50%;pointer-events:none;z-index:3;opacity:0;filter:blur(9px);
  background:radial-gradient(38% 40% at 34% 42%,rgba(243,201,192,.96) 0%,rgba(243,201,192,0) 70%),radial-gradient(36% 38% at 66% 40%,rgba(220,210,242,.96) 0%,rgba(220,210,242,0) 70%),radial-gradient(44% 40% at 50% 64%,rgba(248,220,196,.97) 0%,rgba(248,220,196,0) 72%),radial-gradient(30% 32% at 80% 62%,rgba(201,220,244,.92) 0%,rgba(201,220,244,0) 70%),radial-gradient(28% 30% at 20% 64%,rgba(246,214,200,.92) 0%,rgba(246,214,200,0) 70%),radial-gradient(40% 34% at 50% 48%,rgba(255,255,255,.95) 0%,rgba(255,255,255,0) 72%);
  background-size:130% 130%;background-position:50% 50%}
.as-take>.as-cloudband{animation:asVeilTake 1.3s cubic-bezier(.3,.6,.4,1) both}
.as-give>.as-cloudband{animation:asVeilGive 1.5s cubic-bezier(.3,.6,.4,1) both}
@keyframes asVeilTake{0%{opacity:0;transform:scale(.6) rotate(-10deg);background-position:30% 40%}55%{opacity:.92}100%{opacity:.96;transform:scale(1.04) rotate(4deg);background-position:60% 55%}}
@keyframes asVeilGive{0%{opacity:.96;transform:scale(1.04) rotate(4deg);background-position:60% 55%}45%{opacity:.75}100%{opacity:0;transform:scale(1.35) rotate(14deg);background-position:80% 70%}}
@keyframes asFadeOut{to{opacity:0}}@keyframes asFadeIn{from{opacity:0}}
.as-falling .quote::before,.as-falling .quote::after{animation:asFadeOut .35s ease both}
.as-rising .quote::before,.as-rising .quote::after{animation:asFadeIn .8s ease .35s both}
@media (prefers-reduced-motion:reduce){.as-cloudband{display:none}.as-falling .as-w{animation:asFadeOut .18s ease both;animation-delay:0s}.as-rising .as-w{animation:asFadeIn .3s ease both;animation-delay:0s}}
.speak.full{font-size:.9em;gap:.55em;width:70%}
.speak.full .line,.speak.full .quote,.speak.full .line.aspire{font-size:clamp(.92rem,3vw,1.08rem)}
.title{font-size:clamp(1.5rem,5vw,2rem);letter-spacing:.06em;margin:0}
.line{margin:0;font-size:clamp(1.02rem,3.4vw,1.28rem);line-height:1.5}
.line.soft{color:var(--soft);font-size:clamp(.95rem,3vw,1.06rem)}
.line.q{font-style:italic;color:var(--ink)}
.line.aspire{font-style:italic;color:var(--ink);font-size:clamp(1rem,3.2vw,1.18rem);line-height:1.5}
.quote{margin:0;font-style:italic;font-size:clamp(1rem,3.2vw,1.18rem);line-height:1.5;color:var(--ink)}
.quote::before{content:"\201C"}.quote::after{content:"\201D"}

/* the turns taken, as small lights along the path */
.trail{display:flex;gap:9px;justify-content:center;min-height:14px;margin:14px 0 6px}
.trail button{width:11px;height:11px;border-radius:50%;border:0;padding:0;cursor:pointer;
  background:radial-gradient(circle,#fff 0%,var(--gold) 60%,rgba(233,181,106,0) 100%);opacity:.55;transition:opacity .3s,transform .3s}
.trail button.now{opacity:1;transform:scale(1.3)}
.trail button:focus-visible{outline:2px solid var(--ink);outline-offset:3px}

/* the doors, and the answer */
.doors{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;max-width:620px;margin:6px 0 0}
.door,.btn{font-family:var(--serif);font-size:1rem;color:var(--ink);cursor:pointer;border-radius:999px;
  padding:.62em 1.1em;border:1px solid rgba(233,181,106,.55);
  background:rgba(255,251,245,.72);box-shadow:0 0 18px rgba(233,181,106,.18);transition:box-shadow .3s,background .3s,transform .2s}
.door:hover,.btn:hover{box-shadow:0 0 26px rgba(233,181,106,.4);background:rgba(255,253,249,.92)}
.door:active,.btn:active{transform:scale(.98)}
.door:focus-visible,.btn:focus-visible,textarea:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.btn.lead{background:linear-gradient(180deg,#fff8ee,#fbe6cc);border-color:rgba(214,150,70,.7)}
.btn.quiet{border-color:transparent;background:transparent;box-shadow:none;color:var(--soft);font-size:.95rem}

.say{width:min(620px,92vw);display:flex;gap:10px;align-items:flex-end;margin-top:8px}
textarea{flex:1;font-family:var(--serif);font-size:1.05rem;color:var(--ink);line-height:1.45;resize:none;
  min-height:3.1em;max-height:9em;padding:.8em 1.1em;border-radius:24px;border:1px solid rgba(233,181,106,.5);
  background:rgba(255,252,247,.85);box-shadow:inset 0 0 14px rgba(233,181,106,.12)}
textarea::placeholder{color:var(--faint);font-style:italic}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.hide{display:none!important}
.home{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:12px;z-index:5}
.home .btn{background:rgba(255,251,245,.6);border:1px solid rgba(233,181,106,.4)}
body.insite .stage{padding-top:calc(env(safe-area-inset-top,0px) + 74px);justify-content:flex-start}
body.insite .mirror{margin-top:2vh}
.note{font-size:.85rem;color:var(--faint);margin-top:10px;text-align:center}
@media (max-width:520px){ .say{flex-direction:column;align-items:stretch} .say .btn{align-self:center} }
@media (max-height:640px){ .mirror{width:min(80vw,54vh,540px)} }
</style>
</head>
<body>
<div class="ground" aria-hidden="true"></div>
<nav class="home hide" id="home" aria-label="Leave the Mirror">
  <button class="btn quiet" id="back" type="button">← Back to the map</button>
</nav>
<main class="stage">
  <div class="mirror" id="mirror">
    <svg class="rim" id="rim" viewBox="0 0 100 100" aria-hidden="true">
      <defs><path id="arc" d="M 50,50 m -46,0 a 46,46 0 1,1 92,0 a 46,46 0 1,1 -92,0"/></defs>
      <text><textPath href="#arc" startOffset="0%" id="rimText"></textPath></text>
    </svg>
    <div class="speak" id="speak" aria-live="polite"></div>
  </div>
  <div class="trail" id="trail" aria-label="Your turns so far"></div>
  <div class="doors" id="doors" role="group" aria-label="Ways to begin"></div>
  <div class="say hide" id="say">
    <textarea id="words" rows="2" maxlength="1200" aria-label="Your words"></textarea>
    <button class="btn lead" id="send" type="button">Offer it</button>
  </div>
  <div class="row hide" id="after">
    <button class="btn quiet" id="rest" type="button">Let it rest here</button>
  </div>
  <p class="note" id="note">Nothing you write leaves this page. The Mirror is not a person, and not a therapist.</p>
  <p class="note hide" id="classicRow"><button class="btn quiet" id="classic" type="button">The balance of your light, and the unlit rooms →</button></p>
</main>

<script>
(function(){
"use strict";
/* ── what the Mirror knows how to hear ───────────────────────────────── */
/* 4 Oct 2026 · Karl: "Mirror isnt responding precisely enough." Two of his own
   answers showed why. "Cyclical thoughts, Id like to break" came back as
   "What you want here is to break": it kept the words after "I'd like" and
   dropped what he wanted to break. "new thoughts maybe" came back as "You've
   come back to 'thoughts'": it counted a word, and never heard "new" or
   "maybe", or that he was answering its own question.
   Now it listens to whole thoughts, by the Mirror's Charter (4 Oct 2026):
   what is wished, and what it is wished of; the small honest words (maybe,
   perhaps); what kind of thing is being said (a loop, a choice, a fear); and
   how an answer meets the question asked. Its questions follow one path
   toward the light, at the person's own pace: notice it; feel it in the body;
   hear the voice of the self they are growing into; see the pattern; the part
   not yet looked at; the other's side; one small step; what shifted.
   Karl: "Jung, Krishnamurti, + my own insights, towards the one light (over as
   long as it takes, naturally, years if need be. No rush, intro and
   outraspection, questions that evoke self awareness)."
   It is still not an AI. Nobody's words can talk it into anything.        */
var HEAVY=/\b(kill myself|end my life|suicid|want to die|don'?t want to (live|be here)|hurt myself|self[- ]?harm|no reason to live)\b/i;
var UNSURE=/^\s*(?:i\s+)?(?:really\s+)?(?:don'?t|do not)\s+know[.!]*\s*$|^\s*(?:dunno|no idea|not sure|unsure|maybe|perhaps|i'?m not sure|i'?m unsure)[.!?]*\s*$/i;
var LEAVE=/^\s*(that'?s enough|enough( for now)?|i'?m done|done|bye|goodbye|stop|no more)\b/i;
var CONFUSED=/^\s*[\w'-]{1,14}\s*\?+\s*$|what do you mean|i don'?t (understand|get it)|\bhuh\b|what\?|meaning\?/i;
var MISSED=/doesn'?t make sense|makes no sense|are you (even )?listening|you'?re not listening|not listening|that'?s not what i (said|meant)|you don'?t (get|understand)|you'?re not (getting|hearing)|wrong question|what\?+$/i;

/* the doors: each opens with its own first question, and a plainer way to say it */
var DOORS=[
  {label:'A choice I\u2019m facing', q:'What are the choices, as you see them right now?', plain:'What are you trying to decide between?'},
  {label:'A feeling I can\u2019t place', q:'Where do you feel it, and when did it first arrive?', plain:'Where in your body do you notice it?'},
  {label:'Something that won\u2019t leave me alone', q:'What keeps bringing it back?', plain:'When does it come back to you most?'},
  {label:'I\u2019ve been watching my own mind', q:'What do you notice, when you watch?', plain:'What did you see your mind doing?'}
];

var S={door:-1,turn:0,stage:0,lastQ:null,turns:[],words:{},first:'',theme:'',obj:'',asked:[],felt:[],
  hard:false,others:false,body:false,spoke:false,hedged:false,done:false};
var $=function(id){return document.getElementById(id);};
function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e;}

/*LISTEN>*/
var LISTEN=(function(){
  var FEEL=['tired','exhausted','alone','lonely','stuck','afraid','scared','frightened','angry','furious','sad','lost','hopeful','hope',
    'heavy','overwhelmed','anxious','worried','calm','peaceful','grateful','confused','guilty','ashamed','excited','numb','empty',
    'hurt','free','trapped','restless','drained','small','invisible','unheard','loved','unloved','torn','uncertain','relieved',
    'frustrated','disappointed','rejected','abandoned','nervous','jealous','resentful','bored','joyful','happy','unhappy','grieving','safe','unsafe','content'];
  var HARD=/\b(stuck|lost|tired|exhausted|hard|hurt|pain|afraid|scared|alone|lonely|struggl|anxious|worried|overwhelm|trapped|heavy|numb|sad|angry|can'?t cope|no way|cycl|loop|spiral|ruminat|depress|griev|grief|ashamed|guilt|frustrat|reject|abandon)\w*/i;
  var STOP=/^(about|would|could|should|there|their|which|where|these|those|thing|things|being|really|because|every|other|still|maybe|perhaps|probably|possibly|something|anything|nothing|right|think|doesn't|don't|didn't|can't|won't|isn't|wasn't|aren't|couldn't|wouldn't|shouldn't|there's|what's|that's|you're|i've|i'll|i'd|i'm|it's|it'll|they're|we're|haven't|hasn't|through|again|always|never|going|someone|everything|anyone|actually|feels|feeling|else|little|today|while|whilst|like|want|need)$/;
  var COMMON=/^(this|that|with|have|from|they|them|what|when|just|some|very|much|more|most|your|mine|here|then|than|also|only|into|over|such|even|make|made|will|were|been|does|done|know|said|says|feel|felt|sure|kind|sort|lots|well|yeah|okay)$/;
  var HEDGE=/\b(maybe|perhaps|i think|i guess|i suppose|sort of|kind of|possibly|probably)\b/i;
  var CYCLE=/\b(cycl\w*|loops?|looping|round and round|over and over|again and again|repeat\w*|keeps? (?:coming|going) back|same thoughts?|ruminat\w*|spiral\w*|stuck on|can'?t stop thinking)\b/i;
  var CHOICE=/\b(choose|choice|choosing|decide|decision|deciding|should i)\b/i;
  var FEAR=/\b(afraid|scared|frightened|fear|fears|terrified|dread|nervous|panic\w*)\b/i;
  var OTHERS=/\b(he|she|they|them|him|her|people|everyone|someone|somebody|my (?:mum|mom|mother|dad|father|partner|wife|husband|boss|friends?|son|daughter|brother|sister|family|kids|children|colleagues?))\b/i;
  var BODY=/\b(chest|stomach|belly|throat|head|shoulders?|heart|breath|breathing|jaw|tight|tense|tension|ache|gut|neck)\b/i;
  var PERSON=/\b(mum|mom|mother|dad|father|partner|wife|husband|boss|friend|son|daughter|brother|sister|him|her|he|she|colleague|teacher|neighbou?r)\b/i;
  var TURN=/\s*(?:,\s*)?\b(whilst|while|but|yet|although|though|even though)\b\s*/i;
  var LOOSE=/^(?:it|them|this|that|these|those|him|her)\b|^(?:free|away|for good|once and for all|forever|for ever|soon|now|today|completely|somehow|at last|again)?$/i;
  var NOTOBJ=/^(?:i|i'm|i am|and|but|so|well|yes|no|ok|okay|honestly|really|actually|basically|anyway|sometimes|today|now|lately|also|though|still|yet|maybe|perhaps)$/i;

  /* for hearing only: their own words are always given back exactly as they wrote them */
  function norm(t){
    return String(t||'').replace(/[\u2018\u2019\u02bc]/g,"'")
      .replace(/\bid\b(?=\s+(?:like|love|rather|want|need|say|be|hate))/gi,"I'd")
      .replace(/\bim\b/gi,"I'm").replace(/\bive\b/gi,"I've")
      .replace(/\bill\b(?=\s+(?:be|try|go|do|see|have|never|just|need|always))/gi,"I'll")
      .replace(/\b(dont|cant|wont|isnt|doesnt|didnt|wasnt|arent|couldnt|wouldnt|shouldnt|havent|hasnt)\b/gi,function(w){return w.slice(0,-1)+"'"+w.slice(-1);})
      .replace(/\s+/g,' ').trim();
  }
  function swap(x){var m={'i':'you','me':'you','my':'your','mine':'yours','myself':'yourself',"i'm":"you're","i've":"you've","i'd":"you'd","i'll":"you'll"};
    return String(x||'').replace(/\bi am\b/gi,'you are').replace(/\bi was\b/gi,'you were')
      .replace(/\b(i'm|i've|i'd|i'll|myself|mine|my|me|i)\b/gi,function(w){return m[w.toLowerCase()]||w;});}
  function low(x){x=String(x||'').trim();return x.charAt(0).toLowerCase()+x.slice(1);}
  function cap(x){x=String(x||'').trim();return x.charAt(0).toUpperCase()+x.slice(1);}
  function clean(x){return String(x||'').replace(/\s+/g,' ').trim().replace(/^[,;:\-\u2013\u2014\s]+|[,;:\-\u2013\u2014.!?\s]+$/g,'');}
  function words(t){return String(t||'').toLowerCase().match(/[a-z']+/g)||[];}
  function plural(x){var w=words(x).pop()||'';return /[^s]s$/.test(w)||/^(people|children|they|them|these|those)$/.test(w);}
  function pron(x){return (PERSON.test(x)||plural(x))?'them':'it';}
  function sentences(t){return String(t).replace(/([.!?])\s+/g,'$1\n').split(/\n+/).map(function(x){return x.trim();}).filter(Boolean);}
  function feelings(t){var out=[];FEEL.forEach(function(f){if(new RegExp('\\b'+f+'\\b','i').test(t)&&out.indexOf(f)<0)out.push(f);});return out;}
  function score(x){var s=x.length>12?1:0;FEEL.forEach(function(f){if(new RegExp('\\b'+f+'\\b','i').test(x))s+=3;});
    if(/\b(i|i'm|i am|my|me)\b/i.test(x))s+=2;if(CYCLE.test(x)||HEDGE.test(x))s+=1;return s;}
  /* quoted whole: one sentence, or if it is very long its most alive clause; never cut mid-thought */
  function keyPhrase(t){
    var ss=sentences(t);if(!ss.length)return clean(t);
    var best=ss[0],sc=-1;ss.forEach(function(x){var v=score(x);if(v>sc){sc=v;best=x;}});
    if(best.length>150){var b2=null,s2=-1;best.split(/\s*[,;:\u2013\u2014]\s+|\s+-\s+/).forEach(function(c){var v=score(c);if(c.length>8&&c.length<=150&&v>s2){s2=v;b2=c;}});if(b2)best=b2;}
    if(best.length>170){var cut=best.slice(0,170),sp=cut.lastIndexOf(' ');best=cut.slice(0,sp>100?sp:170)+'\u2026';}
    var b=best.replace(/[.,;:]+$/,''),st=b.replace(/^(?:and|but|so|then|because)\s+/i,'');
    return st!==b?cap(st):b;   /* their words exactly as written; only a clause lifted from mid-sentence loses its leading "and" */
  }
  function keyWord(t){
    var fl=feelings(t);if(fl.length)return fl[0];
    var ws=words(t),best='',bi=-1;
    ws.forEach(function(w,i){if(w.length<4||STOP.test(w)||COMMON.test(w))return;if(w.length>best.length){best=w;bi=i;}});
    if(bi>0){var pw=ws[bi-1];if(pw&&!STOP.test(pw)&&(/^(new|old|same|own|whole|inner|outer|deep|true|real|lost|other)$/.test(pw)||/(al|ful|ous|ive|ic|less|ish|able|ible)$/.test(pw)))best=pw+' '+best;}
    return best;
  }
  function listOf(t){
    var parts=String(t).replace(/\band\b/gi,',').split(/[,;\/]+/).map(function(x){return x.trim().replace(/[.!?]+$/,'');}).filter(Boolean);
    if(parts.length>=3&&parts.every(function(x){return x.split(/\s+/).length<=3;}))return parts;return null;}

  function read(raw){

  if(inSite){var h=el('button','btn quiet','← Back to the map');h.type='button';h.addEventListener('click',function(){tell('close');});r.appendChild(h);}}

/* ── wiring ──────────────────────────────────────────────────────────── */
/* inside Aurasense: a way back to the map, and to the balance and the unlit rooms.
   Messages go only to Aurasense's own page, and say only "close" or "classic". */
var inSite=false;try{inSite=(window.parent!==window)&&/[?&]in=site\b/.test(location.search);}catch(e){}
function tell(act){try{window.parent.postMessage({as:'mirror',act:act},location.origin);}catch(e){}}
if(inSite){document.body.classList.add('insite');$('home').classList.remove('hide');$('classicRow').classList.remove('hide');
  $('back').addEventListener('click',function(){tell('close');});
  $('classic').addEventListener('click',function(){tell('classic');});
  document.addEventListener('keydown',function(e){if(e.key==='Escape')tell('close');});}
$('send').addEventListener('click',hear);
$('words').addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();hear();}});
$('rest').addEventListener('click',rest);
open();
})();
